<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>抽奖管理后台 · 幸运大抽奖</title>
<link rel="stylesheet" href="/static/common.css" />
<link rel="stylesheet" href="/static/admin.css" />
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="logo">🎉 抽奖管理<small>Lucky Draw Console</small></div>
    <div class="nav-group">工作台</div>
    <a class="nav-item" href="#/dashboard">📊 仪表盘</a>
    <a class="nav-item" href="#/activities">🎪 抽奖活动</a>
    <div class="nav-group">系统</div>
    <a class="nav-item" href="#/settings">⚙️ 系统设置</a>
    <a class="nav-item adminOnly" href="#/users">👥 用户管理</a>
      <div class="side-foot">
        <a href="#/settings">🗂 备份与恢复</a>
      </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="crumb" id="crumb"></div>
      <div class="top-actions">
        <select class="select" id="globalAct" title="选择活动后，从右上角打开抽奖或签到"></select>
        <a class="btn btn-sm" id="btnScreen" href="/screen" target="_blank">🎰 抽奖</a>
        <a class="btn btn-sm" id="btnQr" href="/qr" target="_blank">📱 签到</a>
        <div class="user-chip" id="userChip">
          <span class="avatar" id="userAvatar">A</span>
          <span id="userName">—</span>
        </div>
      </div>
    </header>
    <div class="view" id="view"></div>
  </main>
</div>

<div class="toasts" id="toasts"></div>
<div id="modalRoot"></div>

<script src="/static/admin.js"></script>
</body>
</html>
